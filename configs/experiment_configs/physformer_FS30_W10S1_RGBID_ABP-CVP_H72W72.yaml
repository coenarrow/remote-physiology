MODEL:
  NAME: PhysFormer

# Neckflix blood-pressure interface, shared by every model in this directory so
# the runs compare like for like. It is the interface of the 30-epoch PhysMamba
# run in runs/neckflix_physmamba (interface_neckflix_bp.yaml before the
# consolidation), loss weights included.
INTERFACE:
  FS: 30.0                       # frame rate the model sees
  UPSAMPLING: refuse             # slower stores: refuse | interpolate
  WINDOW_SECONDS: 10.0           # 300 frames
  WINDOW_STRIDE: 1.0             # seconds the test set steps between windows
  CHANNELS: [R, G, B, I, D]      # colour, infrared and depth, stacked in this order
  TRACES: [ABP, CVP]             # arterial and central venous pressure, in mmHg
  RESIZE: {H: 72, W: 72}         # the cache is 128 px; every model runs at 72
  LOSS:                          # CCC for shape and level, L1 on the window
    ABP: {CCC: 1.0, MEAN: 0.05, MAX: 0.05, MIN: 0.05}   # mean and the soft
    CVP: {CCC: 1.0, MEAN: 0.20, MAX: 0.20, MIN: 0.20}   # systolic / diastolic

# PhysFormer paper recipe (PURE_PURE_UBFC-rPPG_PHYSFORMER_BASIC.yaml and PhysFormerTrainer).
# The paper's 10 epochs and batch 4 are the launcher's flags: --epochs 10 --batch-size 4
TRAIN:
  OPTIMIZER: Adam              # upstream: optim.Adam(lr, weight_decay=0.00005)
  LR: 1e-4
  WEIGHT_DECAY: 5e-5
  SCHEDULER: Constant          # upstream: StepLR(50, 0.5), never reached in 10 epochs
  PRECISION: float32           # upstream trains in full precision
