MODEL:
  NAME: PhysNet

# PhysNet paper interface. This is the rPPG-Toolbox configuration of PhysNet
INTERFACE:
  FS: 30.0                       # frame rate the model sees
  UPSAMPLING: refuse             # slower stores: refuse | interpolate
  WINDOW_SECONDS: 4.266667       # 128 frames (128 / 30), the upstream CHUNK_LENGTH
  WINDOW_STRIDE: 4.266667        # seconds the test set steps between windows
  CHANNELS: [R, G, B]            # ordered camera channels, subset of R,G,B,I,D
  TRACES: [PPG]                  # the paper predicts BVP and nothing else
  RESIZE: {H: 72, W: 72}         # upstream PhysNet frame size
  LOSS:                          # upstream trains PhysNet with negative Pearson
    PPG: {NEGPEARSON: 1.0}

# PhysNet paper recipe (PURE_PURE_UBFC-rPPG_PHYSNET_BASIC.yaml and PhysnetTrainer).
# The paper's 30 epochs and batch 4 are the launcher's flags: --epochs 30 --batch-size 4
TRAIN:
  OPTIMIZER: Adam              # upstream: optim.Adam(lr), no weight decay
  LR: 9e-3
  WEIGHT_DECAY: 0.0
  SCHEDULER: OneCycle          # upstream: OneCycleLR(max_lr=LR) over every step
  PRECISION: float32           # upstream trains in full precision
