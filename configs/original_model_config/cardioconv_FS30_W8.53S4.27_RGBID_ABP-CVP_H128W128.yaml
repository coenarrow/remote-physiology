# CardioConv as designed in the CardioHydra repository (configs/dataset/neckflix.yaml,
# configs/model/cardioconv.yaml and configs/train/train_config.yaml there).
#
# Unlike the rPPG-Toolbox models beside it, this model's own setup IS Neckflix:
# it was designed for arterial and venous pressure from neck video, so its
# "paper" interface is the five Neckflix channels and the two pressure traces,
# and its proof-of-life command in README.md runs on Neckflix, not PURE.
#
# LABEL LEAKAGE: CardioConv is handed the heart rate of the label
# (src.models.label_heart_rate), at test time too, until it estimates the rate
# from the video itself. Its numbers are not comparable with a model that is
# given frames alone.
MODEL:
  NAME: CardioConv
  PULSATILITY_MASKER: true       # the ablations; all true is the model as designed
  PHASE_MASKER: true
  TRACE_INDEPENDENT: true
  SUPERVISE_MASKS: true
  REGULARISATION:                # the label-free mask priors, at the weights of
    SPARSITY: 0.022              # train_config.yaml's loss_weights (each calibrated
    PULSATILITY_TV: 0.44         # there to contribute about 0.05)
    PULSATILITY_SMOOTHNESS: 1.0
    HARMONIC_COHERENCE: 0.058
    SPATIAL_COHERENCE: 0.018
    TEMPORAL_CONSISTENCY: 0.031
    PHASE_TV: 0.50
    PHASE_SMOOTHNESS: 1.0

INTERFACE:
  FS: 30.0
  UPSAMPLING: refuse
  WINDOW_SECONDS: 8.53           # window_size: 256 frames
  WINDOW_STRIDE: 4.27            # window_stride: 128 frames
  CHANNELS: [R, G, B, I, D]
  TRACES: [ABP, CVP]
  RESIZE: {H: 128, W: 128}       # no resize was configured there; 128 is this cache's own size
  LOSS:
    # The mixer's lag-tolerant Pearson, at its weight of 1.2. The original's
    # per-stage supervised losses do not carry over: the channel predictor's
    # per-channel spectral loss is dropped (it supervised an intermediate),
    # the variance anchor is unnecessary (the output is rescaled from a
    # z-scored waveform), and the statistics head's squared-error regression of
    # the label's mean / std / min / max is replaced by the standard
    # interface's L1 on the output waveform's own mean and soft extremes.
    ABP: {LAGPEARSON: 1.2, MEAN: 0.05, MAX: 0.05, MIN: 0.05}
    CVP: {LAGPEARSON: 1.2, MEAN: 0.20, MAX: 0.20, MIN: 0.20}

# train_config.yaml and src/trainers/trainer.py there: Adam(lr) with no decay
# and no schedule, full precision. Its epochs: 3 and batch_size: 2 were
# notebook development values, not a finished recipe; they are the launcher's
# flags: --epochs 3 --batch-size 2
TRAIN:
  OPTIMIZER: Adam
  LR: 1e-3
  WEIGHT_DECAY: 0.0
  SCHEDULER: Constant
  PRECISION: float32
