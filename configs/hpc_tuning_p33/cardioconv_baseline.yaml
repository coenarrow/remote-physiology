# CardioConv as it stood before the tuning (experiment 14): each trace mixed
# from its own masked candidates only, the masked mean as the candidate. The
# hpc_configs_200 YAML now ships TRACE_INDEPENDENT false (experiment 14) and
# COHERENT_POOLING true (experiment 16; cardioconv_coherent.yaml is the recipe
# as it stands), so this arm sets both old values back to stay the reference
# it was.
BASE: ../hpc_configs_200/cardioconv_FS30_W10S1_RGBID_ABP-CVP_H200W200.yaml
MODEL:
  TRACE_INDEPENDENT: true
  COHERENT_POOLING: false
