BASE: ['']
TOOLBOX_MODE: "train_and_test"  # "train_and_test"  or "only_test"

TRAIN:
  BATCH_SIZE: 2
  EPOCHS: 50
  LR: 3e-3
  MODEL_FILE_NAME: neckflix_CVP_rgb_physhydra
  PLOT_LOSSES_AND_LR: True
  DATA:
    BEGIN: 0.0
    END: 0.8
    FS: 30
    DATASET: Neckflix
    DATA_FORMAT: NCDHW
    DATA_PATH: "/Users/20759193/repos/Neckflix/dataset"          # Raw dataset path (unused by loader; cache is authoritative)
    CACHED_PATH: "/Users/20759193/repos/Neckflix/cached_dir"     # Local subset: P030-P039, 124 recordings
    EXP_DATA_NAME: "local_subset"
    PREPROCESS:
      CHUNK_LENGTH: 128
      DATA_TYPE: ['DiffNormalized']
      RESIZE:
        W: 128
        H: 128
      NECKFLIX:
        CHANNELS: ['R','G','B']
        TRACES: ['CVP']
        CVP_NORM: [-20,30]
        ABP_NORM: [0,200]
        ECG_NORM: [-1500,1500]
        POSTURES: ['0','45','90']
        RANDOM_CHUNK: True

VALID:
  DATA:
    BEGIN: 0.8
    END: 1.0
    FS: 30
    DATASET: Neckflix
    DATA_FORMAT: NCDHW
    DATA_PATH: "/Users/20759193/repos/Neckflix/dataset"
    CACHED_PATH: "/Users/20759193/repos/Neckflix/cached_dir"
    EXP_DATA_NAME: "local_subset"
    PREPROCESS:
      CHUNK_LENGTH: 128
      DATA_TYPE: ['DiffNormalized']
      RESIZE:
        W: 128
        H: 128
      NECKFLIX:
        CHANNELS: ['R','G','B']
        TRACES: ['CVP']
        CVP_NORM: [-20,30]
        ABP_NORM: [0,200]
        ECG_NORM: [-1500,1500]
        POSTURES: ['0','45','90']
        RANDOM_CHUNK: True

TEST:
  METRICS: ['MAE', 'RMSE', 'MAPE', 'SNR', 'BA']
  USE_LAST_EPOCH: False
  DATA:
    BEGIN: 0.0
    END: 1.0
    FS: 30
    DATASET: Neckflix
    DO_PREPROCESS: False
    DATA_FORMAT: NCDHW
    DATA_PATH: "/Users/20759193/repos/Neckflix/dataset"
    CACHED_PATH: "/Users/20759193/repos/Neckflix/cached_dir"
    EXP_DATA_NAME: "local_subset"
    PREPROCESS:
      LABEL_TYPE: "Raw"
      CHUNK_LENGTH: 128
      DATA_TYPE: ['DiffNormalized']
      RESIZE:
        W: 128
        H: 128
      NECKFLIX:
        CHANNELS: ['R','G','B']
        TRACES: ['CVP']
        CVP_NORM: [-20,30]
        ABP_NORM: [0,200]
        ECG_NORM: [-1500,1500]
        POSTURES: ['0','45','90']
        RANDOM_CHUNK: False

DEVICE: cpu
NUM_OF_GPU_TRAIN: 1
LOG:
  PATH: runs/
MODEL:
  NAME: PhysHydra

INFERENCE:
  BATCH_SIZE: 4
  EVALUATION_METHOD: "FFT"
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: False
  MODEL_PATH: ""
